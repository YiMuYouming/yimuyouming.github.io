<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f7;--ink:#1f2328;--sub:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC",serif;line-height:1.7}
main{max-width:800px;margin:0 auto;padding:42px 24px 64px}
.back{color:var(--sub);font-size:13px;text-decoration:none}
header{padding:24px 0 26px}
h1{font-size:26px;font-weight:600;margin:0 0 6px}
.count{margin:0;color:var(--sub);font-size:13px}
.writing-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.writing-list li{border-bottom:1px solid var(--line);font-size:15px}
.writing-row{display:grid;grid-template-columns:110px minmax(0,1fr) 20px;column-gap:18px;align-items:baseline;padding:18px 2px;color:inherit;text-decoration:none}
.writing-date{font-family:"JetBrains Mono",monospace;color:var(--sub);font-size:12px;white-space:nowrap}
.writing-copy{min-width:0;overflow-wrap:anywhere}
.writing-title{display:block;line-height:1.7}
.writing-series{display:block;margin-top:4px;color:var(--sub);font-size:12px}
.writing-arrow{color:var(--sub);text-align:right;font-family:system-ui,sans-serif}
.writing-row:hover .writing-title{text-decoration:underline;text-underline-offset:4px;text-decoration-color:#b45309}
a:focus-visible{outline:2px solid #b45309;outline-offset:3px}
.empty{color:var(--sub);font-size:14px}
@media(max-width:600px){
  main{padding:28px 20px 48px}
  .writing-row{grid-template-columns:minmax(0,1fr) 20px;gap:4px 12px;padding:16px 2px}
  .writing-date{grid-column:1;grid-row:1}
  .writing-copy{grid-column:1;grid-row:2}
  .writing-arrow{grid-column:2;grid-row:1 / span 2;align-self:center}
}
</style>
</head>
